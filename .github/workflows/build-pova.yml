name: Build Solitaire Pova APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Solitaire_Pova_Android.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          test -f Solitaire_Pova_Android.zip
          unzip -q Solitaire_Pova_Android.zip -d extracted
          test -d extracted/Solitaire_Pova_Android/app/src/main

      - name: Prepare Gradle configuration
        working-directory: extracted/Solitaire_Pova_Android
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Solitaire_Pova_Android"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.jawaker.solitaire"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.jawaker.solitaire"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              buildFeatures { viewBinding = true }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("com.google.mlkit:text-recognition:16.0.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.SolitairePova" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
              </style>
          </resources>
          EOF
          sed -i 's/import\.os\.Bundle/import android.os.Bundle/' app/src/main/java/com/jawaker/solitaire/MainActivity.kt
          sed -i 's/android:icon="@mipmap\/ic_launcher"//; s/android:roundIcon="@mipmap\/ic_launcher_round"//' app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: extracted/Solitaire_Pova_Android
        run: |
          gradle --version
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Solitaire-Pova-APK
          path: extracted/Solitaire_Pova_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
