name: Build Solitaire Pova APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Solitaire_Pova_Android_fixed.zip.b64.part*'
      - '.github/workflows/build-pova.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore and extract the repaired project archive
        run: |
          cat Solitaire_Pova_Android_fixed.zip.b64.part* | base64 --decode > Solitaire_Pova_Android_fixed.zip
          unzip -q Solitaire_Pova_Android_fixed.zip -d extracted
          test -f extracted/Solitaire_Pova_Android/app/src/main/AndroidManifest.xml
          test -f extracted/Solitaire_Pova_Android/gradle.properties

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run solver tests and build APK
        working-directory: extracted/Solitaire_Pova_Android
        run: |
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Solitaire-Pova-APK
          path: extracted/Solitaire_Pova_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
