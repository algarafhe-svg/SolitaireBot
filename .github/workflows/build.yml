
name: Build SolitaireBot APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SolitaireFloatingBot_AndroidStudio_Project_FINAL.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q SolitaireFloatingBot_AndroidStudio_Project_FINAL.zip -d extracted
          test -d extracted/SolitaireFloatingBot

      - name: Build APK
        run: |
          cd extracted/SolitaireFloatingBot
          gradle assembleDebug -Pkotlin.jvm.target.validation.mode=warning

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SolitaireBot-APK
          path: extracted/SolitaireFloatingBot/app/build/outputs/apk/debug/app-debug.apk
